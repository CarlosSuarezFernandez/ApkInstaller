name: Release

# Publishes a signed APK as a GitHub Release whenever main contains a version
# (appVersionName in gradle.properties) that has not been released yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(grep -E '^appVersionName=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          [ -n "$name" ] || { echo "appVersionName not found in gradle.properties"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" >/dev/null 2>&1; then
            echo "Release v$name already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.exists == 'false'

      - name: Set up signing key
        if: steps.version.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets are missing; refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Test and build release APK
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify signature
        if: steps.version.outputs.exists == 'false'
        run: |
          apk="app/build/outputs/apk/release/ApkInstaller-${{ steps.version.outputs.name }}-release.apk"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="app/build/outputs/apk/release/ApkInstaller-${{ steps.version.outputs.name }}-release.apk"
          gh release create "${{ steps.version.outputs.tag }}" "$apk" "$apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "ApkInstaller ${{ steps.version.outputs.name }}" \
            --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
